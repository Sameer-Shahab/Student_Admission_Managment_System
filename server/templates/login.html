<!DOCTYPE html>
<html>
<head>
<title>NED-SAMS Login</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e1b4b);
    color:white;
    overflow:hidden;
}

.login-box{
    width:min(92vw, 460px);
    background:rgba(255,255,255,0.08);
    padding:34px 30px;
    border-radius:22px;
    backdrop-filter:blur(18px);
    border:1px solid rgba(0,255,255,0.28);
    box-shadow:0 0 55px rgba(0,255,255,0.22);
    animation:fadeIn 1s ease-in-out;
    position:relative;
    z-index:2;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

input{
    display:block;
    width:100%;
    margin:10px 0 14px 0;
    padding:12px 14px 12px 42px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.18);
    outline:none;
    background:rgba(255,255,255,0.07);
    color:white;
    transition:0.2s;
}

input:focus{
    border-color:rgba(0,255,255,0.6);
    box-shadow:0 0 0 4px rgba(0,255,255,0.12);
}

button{
    width:100%;
    padding:12px;
    border-radius:14px;
    background:linear-gradient(45deg, cyan, #00aaff);
    border:none;
    font-weight:700;
    cursor:pointer;
    transition:0.25s;
}
button:hover{
    transform:translateY(-1px);
    box-shadow:0 0 24px rgba(0,255,255,0.35);
}

.brand{
    display:flex;
    align-items:center;
    /* gap:12px; */
    justify-content:center;
    margin-bottom:18px;
    box-shadow:0 0 18px rgba(0,255,255,0.22);
    border-radius:14px; 
    background:rgba(255,255,255,0.08);
}
.brand img{
    width:120px;
    height:80px;
    /* padding:6px; */
}
.brand .title{
    text-align:left;
    line-height:1.1;
    padding-right: 10px;
}
.brand .title h2{
    font-size:18px;
    font-weight:700;
    color:#00ffff;
}
.brand .title p{
    font-size:12px;
    opacity:0.9;
}

.field{
    position:relative;
}
.icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    opacity:0.85;
}

.hint{
    margin-top:14px;
    font-size:12px;
    opacity:0.78;
    text-align:center;
}

.error{
    margin:10px 0 14px 0;
    padding:10px 12px;
    border-radius:14px;
    background:rgba(255,0,0,0.12);
    border:1px solid rgba(255,0,0,0.25);
    color:#ffd1d1;
    font-weight:600;
    font-size:13px;
}

/* Background glow */
.bg-orb{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:999px;
    filter:blur(60px);
    opacity:0.55;
    z-index:1;
}
.orb1{background:rgba(0,255,255,0.35); top:-220px; left:-160px;}
.orb2{background:rgba(0,170,255,0.35); bottom:-240px; right:-180px;}
.grid{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 78%);
    z-index:0;
}
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="grid"></div>

<div class="login-box">
    <div class="brand">
        <img src="{{ url_for('static', filename='university_logo.png') }}" alt="University Logo">
        <div class="title">
            <h2>NED-SAMS</h2>
            <p>Admin Portal</p>
        </div>
    </div>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" name="username" placeholder="Username" required autofocus>
        </div>
        <div class="field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>
    <div class="hint">Unauthorized access is prohibited.</div>
</div>

</body>
</html>
