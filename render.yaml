services:
  - type: web
    name: ned-sams
    env: python
    rootDir: server
    buildCommand: bash ./render-build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: UPLOAD_FOLDER
        value: /tmp/student_documents
      - key: DATABASE
        value: /tmp/database.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
    # Demo-only: no persistent disk attached. Uploads/DB are ephemeral.
